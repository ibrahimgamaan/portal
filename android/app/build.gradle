plugins { id 'com.android.application' }
android {
    namespace 'app.masrouf'
    compileSdk 34
    defaultConfig {
        applicationId 'app.masrouf'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    flavorDimensions 'sms'
    productFlavors { full { dimension 'sms' }; lite { dimension 'sms'; applicationIdSuffix '' } }
    sourceSets { main { assets.srcDirs = ['../../masrouf'] } }
    packagingOptions { resources { excludes += ['/sw.js'] } }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
