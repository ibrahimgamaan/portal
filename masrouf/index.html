<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>مصروفي</title>
<meta name="description" content="تتبع المصاريف اليومية مع تقارير يومية وشهرية وسنوية احترافية">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --bg:#f3f6f6;--card:#fff;--ink:#0f1f1e;--mute:#5b6a79;--line:#e3eaea;--bd:transparent;--pri:#0f766e;--pri2:#14b8a6;
  --pri-soft:#e6f4f2;--exp:#e11d48;--inc:#16a34a;--warn:#f59e0b;--shadow:0 1px 2px rgba(15,31,30,.05),0 6px 20px rgba(15,31,30,.06);
  --r:18px;--font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b1413;--card:#13201f;--ink:#e8f1f0;--mute:#9db4b2;--line:#233a39;--bd:#1f3433;--pri:#2dd4bf;--pri2:#14b8a6;--pri-soft:#12302d;--exp:#fb7185;--inc:#4ade80;--shadow:0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#0b1413;--card:#13201f;--ink:#e8f1f0;--mute:#9db4b2;--line:#233a39;--bd:#1f3433;--pri:#2dd4bf;--pri2:#14b8a6;--pri-soft:#12302d;--exp:#fb7185;--inc:#4ade80;--shadow:0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
img,svg{-webkit-user-drag:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:var(--bg)}
.top h1{font-size:20px;margin:0;font-weight:700;display:flex;gap:8px;align-items:center}
.top h1 i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--pri2),var(--pri));display:inline-block}
.top .sub{color:var(--mute);font-size:13px}
.view{padding:4px 16px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.view>*{min-width:0}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--bd)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card h3 a,.link{color:var(--pri);font-size:13px;font-weight:500;cursor:pointer}
.hero{background:linear-gradient(135deg,#0f766e,#115e59 60%,#134e4a);color:#fff;border-radius:24px;padding:20px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(15,118,110,.35)}
.hero:after{content:"";position:absolute;inset-inline-start:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lbl{opacity:.8;font-size:13px}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0 10px}
.hero .big small{font-size:15px;font-weight:500;opacity:.85}
.hero .row{display:flex;gap:10px}
.hero .mini{flex:1;background:rgba(255,255,255,.12);border-radius:14px;padding:9px 12px;font-size:12px}
.hero .mini b{display:block;font-size:15px;font-weight:600}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin:6px 0 4px}
.bar>i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .5s}
.card .bar{background:var(--line)}
.bar.ok>i{background:var(--pri2)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--exp)}
.hero .bar>i{background:#fff}.hero .bar.warn>i{background:#fcd34d}.hero .bar.bad>i{background:#fda4af}
.hint{font-size:12px;opacity:.85}
.card .hint{color:var(--mute);opacity:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--card);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow);border:1px solid var(--bd)}
.kpi>span{display:block;font-size:12px;color:var(--mute)}
.kpi b{display:block;font-size:19px;font-weight:700;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;font-weight:600}
.up{color:var(--exp)}.down{color:var(--inc)}
.m{font-variant-numeric:tabular-nums}
small{font-weight:500}
.list{display:grid}
.day{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;font-weight:600;padding:14px 4px 6px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--card);border-radius:14px;margin-bottom:6px;width:100%;text-align:start;box-shadow:var(--shadow);border:1px solid var(--bd)}
.tx .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.tx .t{flex:1;min-width:0}.tx .t b{display:block;font-weight:600;font-size:15px}
.tx .t span{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:700;white-space:nowrap}.tx .a.inc{color:var(--inc)}
.seg{display:flex;background:var(--card);padding:4px;border-radius:14px;gap:4px;box-shadow:var(--shadow)}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--pri);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.nav button{width:42px;height:42px;border-radius:11px;font-size:20px;color:var(--pri)}
.nav button:active{background:var(--pri-soft)}
.nav .lb{font-weight:700;text-align:center}.nav .lb small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{position:relative;width:170px;height:170px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mute)}
.donut .c b{display:block;font-size:18px;color:var(--ink)}
.leg{flex:1;min-width:200px;display:grid;gap:11px}
.leg .it{display:grid;gap:4px}
.leg .h{display:flex;align-items:center;gap:8px;font-size:14px}
.leg .h .dot{width:10px;height:10px;border-radius:50%;flex:none}
.leg .h b{flex:1;font-weight:500}.leg .h span{color:var(--mute);font-size:12px}
.leg .h strong{font-weight:700}
.leg .bar{height:6px;margin:0}
.bars{display:flex;align-items:flex-end;gap:3px;height:160px;padding-top:12px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0;cursor:pointer}
.bars .bw{flex:1;min-height:0;width:100%;position:relative}
.bars .bw i{position:absolute;bottom:0;inset-inline:0;margin:auto;width:100%;max-width:26px;background:linear-gradient(180deg,var(--pri2),var(--pri));border-radius:6px 6px 2px 2px}
.bars .c.z .bw i{background:var(--line)}
.bars .c.hi .bw i{background:linear-gradient(180deg,#fb7185,#e11d48)}
.bars .c.sel .bw i{outline:2px solid var(--ink);outline-offset:1px}
.bars .pv{position:absolute;inset-inline:0;margin:auto;width:100%;max-width:26px;height:3px;border-radius:2px;background:var(--mute);opacity:.7}
.bars .c u{font-size:10.5px;color:var(--mute);text-decoration:none;margin-top:4px;height:14px;white-space:nowrap}
.bars .c s{position:absolute;inset-inline:-4px;text-align:center;font-size:9.5px;color:var(--mute);text-decoration:none;white-space:nowrap}
.tipline{text-align:center;color:var(--mute);font-size:12.5px;margin-top:8px;min-height:20px}
.fab{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom));left:0;right:0;margin-inline:auto;transform:none;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;font-size:34px;line-height:1;box-shadow:0 8px 22px rgba(15,118,110,.45);z-index:30;display:grid;place-items:center;border:4px solid var(--bg)}
.fab:active{filter:brightness(.92)}
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:25;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs .in{display:flex;width:100%;max-width:720px}
.tabs button{flex:1;display:grid;justify-items:center;gap:1px;padding:6px 0;color:var(--mute);font-size:11.5px;font-weight:500}
.tabs button .e{display:grid;place-items:center;height:26px}
.tabs button.on{color:var(--pri);font-weight:700}
.tabs .gap{flex:.9}
.ov{position:fixed;inset:0;background:rgba(2,12,12,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:f .15s}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:u .22s ease-out}
@keyframes u{from{transform:translateY(40px);opacity:.4}}@keyframes f{from{opacity:0}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh b{font-size:17px}.x{width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--mute);font-size:16px}
.amt{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:12px 16px;margin:12px 0;box-shadow:var(--shadow)}
.amt input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:38px;font-weight:700;text-align:start;width:100%;font-variant-numeric:tabular-nums}
.amt span{color:var(--mute);font-weight:600}
.amt.inc input{color:var(--inc)}.amt.exp input{color:var(--exp)}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}
.cg button{background:var(--card);border-radius:14px;padding:10px 2px;display:grid;justify-items:center;gap:3px;font-size:11.5px;border:2px solid transparent;line-height:1.25;text-align:center}
.cg button .e{display:grid;place-items:center;height:26px}
.cg button.on{border-color:var(--pri);background:var(--pri-soft);font-weight:600}
.fld{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:99px;background:var(--card);font-size:13.5px;font-weight:500;border:2px solid transparent}
.chip.on{border-color:var(--pri);color:var(--pri);font-weight:600}
input[type=text],input[type=date],input[type=number],input[type=search],select{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;width:100%;outline:0;min-width:0}
input:focus,select:focus{border-color:var(--pri)}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;padding:14px;border-radius:15px;font-weight:700;background:var(--card);box-shadow:var(--shadow)}
.btn.p{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff}
.btn.d{color:var(--exp);flex:.5}
.set{display:grid;gap:2px}
.set .r{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);width:100%;text-align:start}
.set .r:last-child{border:0}.set .r .e{width:30px;display:grid;place-items:center;color:var(--pri)}
.set .r b{flex:1;font-weight:500}.set .r span{color:var(--mute);font-size:13px}
.empty{text-align:center;padding:36px 16px;color:var(--mute)}
.empty .e{font-size:52px}.empty h3{color:var(--ink);margin:8px 0 4px}
.toast{position:fixed;bottom:calc(110px + env(safe-area-inset-bottom));inset-inline:16px;max-width:420px;margin:auto;background:#10201f;color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:80;animation:u .2s}
.toast button{color:#5eead4;font-weight:700}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters input{grid-column:1/-1}
.colors{display:flex;gap:8px;flex-wrap:wrap}.colors i{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}.colors i.on{border-color:var(--ink)}
.pend{border:2px solid var(--pri2);background:var(--pri-soft)}
.pend .tx{box-shadow:none;margin-bottom:8px;display:block}
.pend .tx .top2{display:flex;align-items:center;gap:12px;min-width:0}.pend .tx{min-width:0}
.pb{display:flex;gap:6px;margin-top:10px}
.pb button{flex:1;padding:9px;border-radius:11px;font-weight:600;font-size:13.5px;background:var(--bg)}
.pb .ok{background:var(--pri);color:#fff}.pb .no{color:var(--exp)}
.pend small.src{color:var(--mute);font-size:11.5px;display:block;margin-top:2px}
.gh{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);font-weight:600;margin:12px 2px 2px}
.sub{padding-inline-start:18px;color:var(--mute);font-size:12.5px;display:flex;justify-content:space-between}
.chips2{display:flex;gap:6px;margin-bottom:10px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px;direction:ltr}
.kp button{height:52px;border-radius:14px;background:var(--card);font-size:23px;font-weight:600;box-shadow:var(--shadow);display:grid;place-items:center}
.kp button:active{transform:scale(.95);background:var(--pri-soft)}
.kp .op{background:var(--pri-soft);color:var(--pri)}.kp .bk{color:var(--exp)}
.hint2{color:var(--mute);font-size:13px;min-height:18px;margin:-6px 4px 4px}
.srch{margin:2px 0 6px}.amt input[readonly]{cursor:default}
.gbtn{width:100%;background:none;text-align:start;margin-top:8px;color:var(--mute)}.gbtn .cnt{background:var(--line);border-radius:99px;padding:0 8px;font-size:11px}
.gbtn .chev{margin-inline-start:auto;display:grid;transition:transform .2s}.gbtn .chev.up{transform:rotate(180deg)}
.allbtn{display:flex;align-items:center;gap:6px;margin:4px 2px 2px}
.gh svg,.leg .h svg{flex:none}.leg .h svg{width:17px;height:17px}
.ring{position:absolute;inset-inline-end:18px;top:20px;width:68px;height:68px;z-index:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{stroke:rgba(255,255,255,.22)}.ring circle.fg{stroke:#fff;transition:stroke-dasharray .6s}
.ring.warn circle.fg{stroke:#fcd34d}.ring.bad circle.fg{stroke:#fda4af}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.st{background:var(--bg);border-radius:13px;padding:10px 12px}.st span{display:block;font-size:12px;color:var(--mute)}.st b{display:block;font-size:14.5px;margin-top:1px}.st em{font-style:normal;font-size:12px;color:var(--mute)}
.view.enter>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.05s}.view.enter>*:nth-child(3){animation-delay:.1s}.view.enter>*:nth-child(4){animation-delay:.15s}.view.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.tx{position:relative;touch-action:pan-y;transition:transform .2s,background .15s}.tx.sw-d{box-shadow:inset 0 0 0 2px #f87171}.tx.sw-e{box-shadow:inset 0 0 0 2px #4ade80}
.ob{text-align:center;padding:10px 6px 4px}.ob .obi{width:92px;height:92px;border-radius:28px;margin:6px auto 14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--pri2),var(--pri));box-shadow:0 10px 26px rgba(15,118,110,.35)}
.ob h2{margin:0 0 8px;font-size:22px}.ob p{margin:0 auto;max-width:320px;color:var(--mute);line-height:1.8}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}.dots i{width:8px;height:8px;border-radius:99px;background:var(--line)}.dots i.on{width:22px;background:var(--pri)}
.printhead .ph{display:flex;gap:12px;align-items:center}
.hr{display:flex;align-items:center;gap:12px}
.ibtn{position:relative;width:42px;height:42px;border-radius:13px;background:var(--card);color:var(--pri);box-shadow:var(--shadow);display:grid;place-items:center;border:1px solid var(--bd)}
.ibtn b{position:absolute;top:-5px;inset-inline-end:-5px;min-width:19px;height:19px;border-radius:99px;background:var(--exp);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.snip{font-size:12.5px;color:var(--mute);line-height:1.6;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;direction:auto;unicode-bidi:plaintext;text-align:start}
.mrow{background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid var(--bd)}
.mrow .top2{display:flex;align-items:center;gap:10px}.mrow .top2 b{flex:1}.mrow .top2 em{font-style:normal;font-weight:700}
details.card summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
.pick{display:flex;align-items:center;gap:8px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:9px 12px;text-align:start;min-width:0}
.pick .pi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}.pick .pi svg{width:16px;height:16px}
.pick b{flex:1;min-width:0;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pick .cv{color:var(--mute);display:grid}
.ov.pk{z-index:60}.pks{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.pks .pkl{display:grid;gap:4px}
.pkg{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--mute);margin:14px 4px 4px}.pkg:first-child{margin-top:2px}.pkg i{flex:1;height:1px;background:var(--line)}
.pki{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border-radius:14px;padding:9px 12px;border:2px solid transparent;min-height:54px}
.pki:active{background:var(--pri-soft)}
.pki .pi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.pki b{flex:1;min-width:0;font-weight:500;font-size:15px}
.pki .ck{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--pri);opacity:0;flex:none}
.pki.on{border-color:var(--pri);background:var(--pri-soft)}.pki.on b{font-weight:700}.pki.on .ck{opacity:1}
.pki.all .pi{background:var(--pri-soft);color:var(--pri)}
.stp{display:flex;gap:12px;align-items:flex-start;padding:9px 0;font-size:14px;line-height:1.7}.stp i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.stp.done i{background:var(--pri);color:#fff}.stp.done span{color:var(--mute)}
.pend .tx .t span{white-space:normal}
.pki.gi{background:var(--pri-soft)}.pki.gi b{font-weight:700;color:var(--pri)}
.pks .srch{margin:0 0 8px}
.crumb{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border:2px solid var(--pri)}
.crumb .ci{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.crumb b{display:block;font-size:16px}.crumb small{color:var(--mute);font-size:12.5px}
.crumb .go{margin-inline-start:auto;color:var(--pri);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:4px;flex:none}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;background:var(--card);font-size:13.5px;font-weight:600;box-shadow:var(--shadow);border:2px solid transparent}
.pill.on{border-color:var(--pri);color:var(--pri)}
.printhead{display:none}
@media print{
  body{background:#fff;color:#000}.top,.tabs,.fab,.noprint,.toast,.seg,.nav button{display:none!important}
  .printhead{display:block;border-bottom:3px solid #0f766e;padding-bottom:10px;margin-bottom:12px}

const haptic = (ms = 12) => { try { if (window.AndroidBridge && AndroidBridge.haptic) AndroidBridge.haptic(ms); else if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

const pad = x => String(x).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [a,b,c] = s.split('-').map(Number); return new Date(a, b-1, c); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ============ الحالة ============ */
const defaults = () => ({
  tx: [], pending: [], merchants: {}, seen: [], cats: DEF_CATS.map(c => ({...c, budget: 0})),
  set: {cur: 'ر.س', budget: 0, digits: 'latin', theme: 'auto', auto: false}, migr: ['v4', 'v4b', 'v5', 'v6', 'v7'], rec: [], maybe: [], ignored: []
});
function migrate() {
  S.d.maybe = S.d.maybe || []; S.d.ignored = S.d.ignored || [];
  S.d.migr = S.d.migr || []; S.d.rec = S.d.rec || []; S.d.pending = S.d.pending || []; S.d.merchants = S.d.merchants || {};
  if (!S.d.migr.includes('v6') && S.d.migr.includes('v5')) {
    const have = new Set(S.d.cats.map(c => c.id));
    S.d.cats.forEach(c => { const d = DEF_CATS.find(x => x.id === c.id); if (d) { c.group = d.group; if (c.id === 'bills') { c.name = d.name; c.icon = d.icon; } } });
    V6_NEW.forEach(id => { if (!have.has(id)) S.d.cats.push({...DEF_CATS.find(x => x.id === id), budget: 0}); });
    const order = DEF_CATS.map(c => c.id), oi = order.indexOf('other');
    const key = c => { const i = order.indexOf(c.id); return i >= 0 ? i : oi - .5; };
    S.d.cats = S.d.cats.map((c, i) => ({c, i})).sort((a, b) => key(a.c) - key(b.c) || a.i - b.i).map(x => x.c);
    S.d.migr.push('v6');
  }
  if (!S.d.migr.includes('v7') && S.d.migr.includes('v6')) {
    // إضافة فقط: لا نعيد تسمية شيء ولا نكرّر فئة أضافها المستخدم بنفسه بنفس الاسم
    if (!S.d.cats.some(c => c.id === 'supplies' || c.name === 'مستلزمات البيت')) {
      const i = S.d.cats.findIndex(c => c.id === 'repair');
      S.d.cats.splice(i < 0 ? Math.max(S.d.cats.length - 1, 0) : i + 1, 0, {...DEF_CATS.find(x => x.id === 'supplies'), budget: 0});
    }
    S.d.migr.push('v7');
  }
  if (!S.d.migr.includes('v5') && S.d.migr.includes('v4')) {
    S.d.cats.forEach(c => { const d = DEF_CATS.find(x => x.id === c.id); if (d && !ICON_SVG[c.icon]) c.icon = d.icon; });
    S.d.migr.push('v5');
  }
  if (S.d.migr.includes('v4')) {
    if (!S.d.migr.includes('v4b')) { if (!S.d.cats.some(c => c.id === 'personal')) { const i = S.d.cats.findIndex(c => c.id === 'gift'), d = DEF_CATS.find(c => c.id === 'personal');
      S.d.cats.splice(i < 0 ? S.d.cats.length - 1 : i + 1, 0, {...d, budget: 0}); } S.d.migr.push('v4b'); }
    return;
  }
  const old = S.d.cats, byId = Object.fromEntries(old.map(c => [c.id, c])), ids = DEF_CATS.map(c => c.id);
  Object.entries(REMOVED).forEach(([from, to]) => { if (!byId[from]) return;
    S.d.tx.forEach(t => { if (t.cat === from) t.cat = to; }); S.d.pending.forEach(t => { if (t.cat === from) t.cat = to; });
    S.d.rec.forEach(t => { if (t.cat === from) t.cat = to; }); Object.keys(S.d.merchants).forEach(k => { if (S.d.merchants[k] === from) S.d.merchants[k] = to; }); });
  const out = DEF_CATS.map(d => byId[d.id] ? {...byId[d.id], name: d.name, group: d.group} : {...d, budget: 0});
  const custom = old.filter(c => !ids.includes(c.id) && !REMOVED[c.id]).map(c => ({...c, group: c.group || 'other'}));
  out.splice(out.length - 1, 0, ...custom);
  S.d.cats = out; S.d.migr = ['v2', 'v3', 'v4', 'v4b', 'v5', 'v6', 'v7'];
}
let S = {tab: 'home', rep: {mode: 'month', ref: new Date(), by: 'cat'}, f: {q: '', cat: '', month: ''}, d: defaults()};
function load() {
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && Array.isArray(r.tx)) { const d = defaults(); S.d = {...d, ...r, set: {...d.set, ...(r.set||{})}, cats: r.cats?.length ? r.cats : d.cats, migr: r.migr || []}; migrate(); save(); } } catch (e) {}
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S.d)); } catch (e) { toast('تعذّر الحفظ: مساحة التخزين ممتلئة أو ممنوعة'); } }
function applyTheme() { document.documentElement.dataset.theme = S.d.set.theme; }

/* ============ تنسيق ============ */
const dg = s => S.d.set.digits === 'ar' ? String(s).replace(/\d/g, d => AR_DIG[d]) : String(s);
const num = (x, dec = 2) => (x < 0 ? '\u200E' : '') + dg((Math.round(x * 100) / 100).toLocaleString('en-US', {maximumFractionDigits: dec}));
const money = x => `<span class="m">${num(x)}</span> <small>${esc(S.d.set.cur)}</small>`;
const sign = (t, x) => (t === 'inc' ? '+' : '−') + num(x);
const catOf = id => {
  if (typeof id === 'string' && id.startsWith('g:')) { const g = GROUPS.find(x => x.id === id.slice(2)); if (g) return {id, name: g.name + ' (عام)', icon: g.icon, color: g.color, group: g.id, isGroup: true}; }
  return S.d.cats.find(c => c.id === id) || INC_CATS.find(c => c.id === id) || {id, name: 'فئة محذوفة', icon: 'package', color: '#94a3b8'};
};
const nrm = x => String(x || '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[\u064B-\u0652]/g, '').trim();
const hit = (name, q) => nrm(name).includes(nrm(q));
const todayStr = () => ymd(new Date());
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return dg(`${h % 12 || 12}:${pad(m)}`) + (h < 12 ? ' ص' : ' م'); };
const tcmp = (a, b) => b.date.localeCompare(a.date) || (b.time || '').localeCompare(a.time || '') || b.ts - a.ts;
function dayLabel(s) {
  const d = parse(s), t = todayStr(), y = ymd(new Date(Date.now() - 864e5));
  const base = `${DAYS[d.getDay()]} ${dg(d.getDate())} ${MONTHS[d.getMonth()]}`;
  return s === t ? 'اليوم · ' + base : s === y ? 'أمس · ' + base : base;
}
const monthLabel = d => `${MONTHS[d.getMonth()]} ${dg(d.getFullYear())}`;
const sum = (arr, type = 'exp') => arr.filter(t => t.type === type).reduce((a, t) => a + t.amount, 0);
const daysIn = d => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
function toast(msg, undo) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button>تراجع</button>' : ''}`;

/* ============ فلترة الفترات ============ */
function weekStart(ref) { const d = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate()); d.setDate(d.getDate() - (d.getDay() + 1) % 7); return d; }
function inPeriod(t, mode, ref) {
  if (mode === 'week') { const a = ymd(weekStart(ref)), e = new Date(weekStart(ref)); e.setDate(e.getDate() + 6); return t.date >= a && t.date <= ymd(e); }
  const y = ref.getFullYear(), m = pad(ref.getMonth() + 1);
  if (mode === 'day') return t.date === ymd(ref);
  if (mode === 'month') return t.date.startsWith(`${y}-${m}`);
  return t.date.startsWith(`${y}-`);
}
function shift(mode, ref, k) {
  const d = new Date(ref);
  if (mode === 'day') d.setDate(d.getDate() + k);
  else if (mode === 'week') d.setDate(d.getDate() + 7 * k);
  else if (mode === 'month') { d.setDate(1); d.setMonth(d.getMonth() + k); }
  else { d.setDate(1); d.setFullYear(d.getFullYear() + k); }
  return d;
}
function groupByCat(list) {
  const m = {};
  list.filter(t => t.type === 'exp').forEach(t => m[t.cat] = (m[t.cat] || 0) + t.amount);
  return Object.entries(m).map(([id, v]) => ({...catOf(id), v})).sort((a, b) => b.v - a.v);
}

/* ============ المكوّنات ============ */

    <span class="a ${t.type}">${sign(t.type, t.amount)} <small>${esc(S.d.set.cur)}</small></span></button>`;
}
function donut(items, total, label) {
  let off = 0;
  const segs = items.map(i => {
    const p = i.v / total * 100, s = `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${i.color}" stroke-width="6" stroke-dasharray="${Math.max(p - .6, .1)} ${100 - Math.max(p - .6, .1)}" stroke-dashoffset="${-off}"/>`;
    off += p; return s;
  }).join('');
  return `<div class="donut"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="6"/>${segs}</svg>
    <div class="c"><div><b class="m">${num(total, 0)}</b>${label}</div></div></div>`;
}
function bars(vals, labels, hiIdx, showVals, prev, tips) {
  const max = Math.max(...vals, ...(prev || []), 1);
  const col = vals.map((v, i) => { const h = v / max * 86, pv = prev && prev[i] ? prev[i] / max * 86 : 0;
    return `<div class="c ${v === 0 ? 'z' : ''} ${i === hiIdx && v > 0 ? 'hi' : ''}" data-tip="${esc(tips ? tips[i] : labels[i])}: ${num(v)} ${esc(S.d.set.cur)}">
    <div class="bw">${showVals && v > 0 ? `<s style="bottom:calc(${h}% + 2px)">${num(v, 0)}</s>` : ''}<i style="height:${Math.max(h, 1.5)}%"></i>${pv ? `<b class="pv" style="bottom:${pv}%"></b>` : ''}</div><u>${labels[i]}</u></div>`; }).join('');
  return `<div class="bars">${col}</div><div class="tipline" id="tipline">اضغط على أي عمود لعرض التفاصيل${prev ? ' · الخط الرمادي = الفترة السابقة' : ''}</div>`;
}
function series(mode, ref, list) {
  const ex = list.filter(t => t.type === 'exp');
  if (mode === 'month') { const n = daysIn(ref), v = Array(n).fill(0); ex.forEach(t => v[+t.date.slice(8) - 1] += t.amount);
    return {v, lab: v.map((_, i) => i % 5 === 0 || i === n - 1 ? dg(i + 1) : ''), tip: v.map((_, i) => `${dg(i + 1)} ${MONTHS[ref.getMonth()]}`)}; }
  if (mode === 'year') { const v = Array(12).fill(0); ex.forEach(t => v[+t.date.slice(5, 7) - 1] += t.amount);
    return {v, lab: MONTHS.map(m => m.slice(0, 3)), tip: MONTHS.slice()}; }

function runRecurring() {
  const now = new Date(), cm = now.getFullYear() * 12 + now.getMonth(); let n = 0;
  (S.d.rec || []).forEach(r => {
    const [y, m] = r.last.split('-').map(Number);
    for (let k = y * 12 + m; k <= cm; k++) {
      const yy = Math.floor(k / 12), mm = k % 12, d = Math.min(r.day, new Date(yy, mm + 1, 0).getDate());
      if (k === cm && d > now.getDate()) break;
      S.d.tx.push({id: uid(), ts: Date.now() + n, type: r.type, amount: r.amount, cat: r.cat, note: r.note, date: `${yy}-${pad(mm + 1)}-${pad(d)}`, rec: r.id});
      r.last = `${yy}-${pad(mm + 1)}`; n++;

  });
  if (n) { save(); render(); toast(`سُجّلت ${dg(n)} عملية متكررة تلقائياً 🔁`); }
}

const mkey = m => String(m || '').toLowerCase().replace(/\s+/g, ' ').trim();
function learn(merchant, cat) { const k = mkey(merchant); if (k) S.d.merchants[k] = cat; }
function ingestSms(list) {
  const res = {pending: 0, auto: 0, maybe: 0, ignored: 0};
  list.forEach(m => {
    const body = String(m.body || '');
    const key = (m.sender || '') + '|' + m.ts + '|' + body.length + '|' + body.slice(0, 40);
    if (S.d.seen.includes(key)) return; S.d.seen.push(key);
    let kind = m.k || SmsParser.classify(body), r = SmsParser.parseLoose(body, m.ts);
    if (kind === 'txn' && !r) {   // الجهة المصنِّفة (جافا) جزمت بعملية: نعتمد مبلغها وتاجرها حتى لا يضيع الإشعار
      const amt = parseFloat(m.amt), d = new Date(m.ts || Date.now());
      if (amt > 0) r = {type: /(إيداع|ايداع|راتب|واردة|credited|received|refund|استرداد)/i.test(body) ? 'inc' : 'exp', amount: amt, merchant: m.mer || '', date: ymd(d), time: `${pad(d.getHours())}:${pad(d.getMinutes())}`, cat: 'other'};
      else kind = 'maybe';
    }
    if (r) r.note = (r.merchant || '') + (r.detail ? (r.merchant ? ' — ' : '') + r.detail : '');
    if (r && r.type === 'exp') { const k = mkey(r.merchant); if (S.d.merchants[k]) r.cat = S.d.merchants[k]; }
    if (kind === 'txn' && r) {
      if (S.d.set.auto && r.cat !== 'other') { S.d.tx.push({id: uid(), ts: Date.now(), type: r.type, amount: r.amount, cat: r.cat, note: r.note || r.merchant || '', date: r.date, time: r.time, auto: true}); learn(r.merchant, r.cat); res.auto++; S.auto = (S.auto || 0) + 1; }
      else { S.d.pending.push({id: uid(), sender: m.sender, body: body.slice(0, 300), ...r}); res.pending++; }
    } else if (kind === 'maybe') { S.d.maybe.push({id: uid(), sender: m.sender, ts: m.ts, body: body.slice(0, 300), ...(r || {})}); res.maybe++; }
    else { S.d.ignored.unshift({id: uid(), sender: m.sender, ts: m.ts, body: body.slice(0, 300)}); res.ignored++; }
  });
  S.d.ignored = S.d.ignored.slice(0, 40); S.d.seen = S.d.seen.slice(-400); save(); return res;
}

function demo() {
  const items = [['food', 18, 45, 'قهوة وإفطار'], ['groc', 90, 320, 'بقالة'], ['trans', 40, 180, 'بنزين'], ['bills', 150, 600, 'فواتير'], ['shop', 80, 700, 'ملابس'], ['fun', 40, 250, 'سينما'], ['health', 60, 300, 'صيدلية'], ['food', 35, 120, 'غداء']];

    const k = rnd() < .55 ? 1 : rnd() < .5 ? 2 : 0;
    for (let i = 0; i < k; i++) { const it = items[Math.floor(rnd() * items.length)];
      S.d.tx.push({id: uid(), ts: d.getTime() + i, type: 'exp', amount: Math.round(it[1] + rnd() * (it[2] - it[1])), cat: it[0], note: it[3], date: ymd(d)}); }
    if (d.getDate() === 27) S.d.tx.push({id: uid(), ts: d.getTime(), type: 'inc', amount: 9000, cat: 'salary', note: 'راتب الشهر', date: ymd(d)});
  }
  S.d.set.budget = 5500; save(); render(); toast('تمت إضافة بيانات تجريبية، يمكنك مسحها من المزيد');
}

/* تشغيل */
document.querySelectorAll('[data-i]').forEach(e => e.innerHTML = ic(e.dataset.i, 24, 1.9));
load(); applyTheme(); S.enter = true; render(); pullSms();
if (!S.d.set.onboarded && !S.d.tx.length) onboard(); runRecurring();
document.addEventListener('visibilitychange', () => { if (!document.hidden) runRecurring(); });
if ('serviceWorker' in navigator && /^https:|localhost|127\.0\.0\.1/.test(location.protocol + location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__app = {S, render};
</script>
